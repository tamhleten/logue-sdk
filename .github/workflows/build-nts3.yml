name: Build NTS-3 units

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-nts3:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build logue SDK Docker image
        run: ./docker/build_image.sh

      - name: Build fb-ring
        run: ./docker/run_cmd.sh build nts-3_kaoss/fb-ring

      - name: Verify build artifact
        run: |
          ls -lh platform/nts-3_kaoss/fb-ring/fb_ring.nts3unit

      - name: Upload fb-ring NTS-3 unit
        uses: actions/upload-artifact@v4
        with:
          name: fb-ring-nts3
          path: platform/nts-3_kaoss/fb-ring/fb_ring.nts3unit
          if-no-files-found: error

      - name: Build pit-shift
        run: ./docker/run_cmd.sh build nts-3_kaoss/pit-shift

      - name: Verify pit-shift artifact
        run: |
          ls -lh platform/nts-3_kaoss/pit-shift/pit_shift.nts3unit

      - name: Upload pit-shift NTS-3 unit
        uses: actions/upload-artifact@v4
        with:
          name: pit-shift-nts3
          path: platform/nts-3_kaoss/pit-shift/pit_shift.nts3unit
          if-no-files-found: error

      - name: Host-test afterimage
        run: |
          g++ -std=c++11 -O2 \
            -Iplatform/nts-3_kaoss/common \
            platform/nts-3_kaoss/afterimage/test_host.cc \
            -o /tmp/afterimage-test
          /tmp/afterimage-test

      - name: Build afterimage
        run: ./docker/run_cmd.sh build nts-3_kaoss/afterimage

      - name: Verify afterimage artifact
        run: |
          ls -lh platform/nts-3_kaoss/afterimage/afterimage.nts3unit

      - name: Upload afterimage NTS-3 unit
        uses: actions/upload-artifact@v4
        with:
          name: afterimage-nts3
          path: platform/nts-3_kaoss/afterimage/afterimage.nts3unit
          if-no-files-found: error

      - name: Host-test dub echo
        run: |
          g++ -std=c++11 -O2 \
            -Iplatform/nts-3_kaoss/common \
            platform/nts-3_kaoss/dub-echo/test_host.cc \
            -o /tmp/dub-echo-test
          /tmp/dub-echo-test

      - name: Build dub echo
        run: ./docker/run_cmd.sh build nts-3_kaoss/dub-echo

      - name: Verify dub echo artifact
        run: |
          ls -lh platform/nts-3_kaoss/dub-echo/dub_echo.nts3unit

      - name: Upload dub echo NTS-3 unit
        uses: actions/upload-artifact@v4
        with:
          name: dub-echo-nts3
          path: platform/nts-3_kaoss/dub-echo/dub_echo.nts3unit
          if-no-files-found: error
